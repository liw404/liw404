<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de fondo oscuro estilo Linear/Vercel -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A1124" />
    </linearGradient>

    <!-- Gradiente para el resplandor de acento azul PUCP / Real -->
    <radialGradient id="glowAccent" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#1E40AF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente de texto principal -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Patrón de retícula técnica sutil -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.35" />
      <circle cx="0" cy="0" r="1" fill="#64748B" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Fondo base -->
  <rect width="900" height="220" rx="16" fill="url(#bgGradient)" />

  <!-- Capa de retícula técnica geométrica -->
  <rect width="900" height="220" rx="16" fill="url(#techGrid)" />

  <!-- Resplandor sutil lateral -->
  <rect width="900" height="220" rx="16" fill="url(#glowAccent)" />

  <!-- Borde nítido exterior de 1px -->
  <rect x="0.5" y="0.5" width="899" height="219" rx="15.5" stroke="#1E293B" stroke-width="1" />

  <!-- Elementos vectoriales de arquitectura abstracta a la derecha -->
  <g opacity="0.45" transform="translate(680, 25)">
    <!-- Bloque de arquitectura geométrica -->
    <rect x="0" y="20" width="140" height="40" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <text x="70" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">CLIENT / UI (React)</text>

    <!-- Conector -->
    <path d="M 70 60 L 70 85" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Bloque de servicios / arquitectura -->
    <rect x="10" y="85" width="120" height="40" rx="6" fill="#1E293B" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.6" />
    <text x="70" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#60A5FA" text-anchor="middle">REST / ADAPTERS</text>

    <!-- Conector -->
    <path d="M 70 125 L 70 145" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Bloque de datos -->
    <rect x="25" y="145" width="90" height="30" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.5" />
    <text x="70" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">STORAGE / DB</text>
  </g>

  <!-- Indicador de estado superior: Active / Engineering -->
  <g transform="translate(48, 38)">
    <rect width="138" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10B981" />
    <text x="24" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">PUCP INFORMATICS</text>
  </g>

  <!-- Nombre Principal con tipografía contundente -->
  <text x="48" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.8">
    WILLIAM NUNEZ
  </text>

  <!-- Título y Especialidad Técnica -->
  <text x="48" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="15.5" font-weight="600" fill="#38BDF8" letter-spacing="-0.2">
    Software Engineering Student
  </text>
  <text x="272" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#64748B">
    |
  </text>
  <text x="286" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="15" font-weight="500" fill="#E2E8F0" letter-spacing="-0.2">
    Frontend, Backend &amp; Software Architecture
  </text>

  <!-- Subtítulo de propósito técnico -->
  <text x="48" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">
    Building reliable, modular web systems and interactive applications with modern engineering practices.
  </text>
</svg>
